[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epanet-mcp-server"
version = "1.0.1"
description = "MCP server for EPANET water distribution network simulation via ePyT. Developed and maintained by Eurecat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["epanet", "epyt", "mcp", "water-distribution", "hydraulic-simulation"]
dependencies = [
    "mcp>=1.24.0,<2.0.0",
    "epyt>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pytest>=9.0.3",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]
examples = [
    "langchain>=1.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.0",
    "tqdm",
    "Jinja2"
]

[project.scripts]
epanet-mcp-server = "epanet_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
